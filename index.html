<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  background: linear-gradient(135deg, #ff6b81, #ff9aa2, #ffc3a0);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  text-align: center;
  color: white;
  position: relative;
}

/* Floating hearts */
.heart {
  position: absolute;
  color: rgba(255,255,255,0.3);
  font-size: 20px;
  animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
  from { transform: translateY(100vh); opacity: 1; }
  to { transform: translateY(-10vh); opacity: 0; }
}

.container {
  padding: 20px;
  width: 90%;
  max-width: 400px;
}

h1 {
  font-size: 1.8rem;
  margin-bottom: 30px;
  line-height: 1.4;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 15px;
  position: relative;
}

button {
  padding: 14px 28px;
  border: none;
  border-radius: 40px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

#yesBtn {
  background: white;
  color: #ff4d6d;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

#noBtn {
  background: rgba(255,255,255,0.3);
  color: white;
  backdrop-filter: blur(10px);
}

.love-message {
  display: none;
  margin-top: 25px;
  animation: fadeIn 1s ease forwards;
}

.love-message h2 {
  margin-bottom: 15px;
  font-size: 1.8rem;
}

.love-message p {
  font-size: 1rem;
  line-height: 1.6;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(10px);}
  to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="container">
  <h1>Will you be my Valentine? 💌</h1>

  <div class="buttons">
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 🥺</button>
  </div>

  <div class="love-message" id="loveMessage">
    <h2>I LOVE YOU ❤️</h2>

    <!-- 💌 EDIT YOUR MESSAGE BELOW 💌 -->
    <p>
      You are the most beautiful part of my life.
      Every moment with you feels magical, and I’m so grateful for your smile,
      your laugh, and the way you make my heart feel safe.
      I promise to cherish you today and always.
      Happy Valentine’s Day, my love ❤️
    </p>

  </div>
</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const loveMessage = document.getElementById("loveMessage");

let yesScale = 1;
let noScale = 1;

noBtn.addEventListener("click", () => {
  yesScale += 0.25;
  noScale -= 0.2;

  yesBtn.style.transform = `scale(${yesScale})`;
  noBtn.style.transform = `scale(${noScale})`;

  if (noScale <= 0) {
    noBtn.style.display = "none";
  }
});

yesBtn.addEventListener("click", () => {
  document.querySelector(".buttons").style.display = "none";
  loveMessage.style.display = "block";
});

/* Floating hearts generator */
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 15 + 15 + "px";
  heart.style.animationDuration = Math.random() * 3 + 3 + "s";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
